{{define "title"}}Admin Login{{end}}
{{define "content"}}
<div class="center-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>🛡️ Admin Login</h1>
      <p>Authenticate to manage Funnel rules and keys</p>
    </div>

    {{if .Error}}
    <div class="alert alert-danger">
      <div class="alert-title">Authentication Failed</div>
      <div>{{.Error}}</div>
    </div>
    {{end}}

    <form action="/admin/login" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="Admin username" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="flex-row">
          <input type="password" id="password" name="password" required placeholder="Enter admin password" autocomplete="current-password">
          <button type="button" class="btn btn-secondary toggle-password" data-target="password" style="padding: 0.75rem;">Show</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
      <a href="/" style="color: var(--text-muted);">Back to Visitor Access</a>
    </div>
  </div>
</div>
{{end}}
{{template "layout" .}}
